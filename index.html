    <script>
      // Defensive shim for environment scripts & browser extensions that reassign window.fetch
      (function () {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _currentFetch;
            },
            set: function (newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (err) {
          // Fallback if defineProperty fails
        }
      })();
    </script>
